name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MoonbitHub/moon-setup@v1
        with:
          moon-version: latest
      - name: Check
        run: moon check
      - name: Test (VM core)
        run: moon test
      - name: Build wasm kernel (release)
        run: moon build --target wasm --release
      - name: Kernel end-to-end tests (real ROMs)
        run: |
          cp _build/wasm/release/build/src/kernel/kernel.wasm web/moonchip.wasm
          node web/test-kernel.mjs
